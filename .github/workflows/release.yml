name: release.yml
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and use for the draft release (example: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/raphaelquintao/qredshift-cross:debian-13
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user q
      volumes:
        - ${{ github.workspace }}:/home/q/qredshift
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    defaults:
      run:
        working-directory: /home/q/qredshift

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag_name) || github.ref }}
          path: /home/q/qredshift

      - name: Fix Directory Ownership
        run: sudo chown -R q:q /home/q/qredshift

      - name: Update compiler toolchains
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y --no-install-recommends

      - name: Test
        run: ls -la

