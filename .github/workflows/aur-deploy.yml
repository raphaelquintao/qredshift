name: AUR Package Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to fetch assets and update (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  aur-job:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Missing Automation Utilities inside Arch
        shell: bash
        run: |
          pacman -Syu --noconfirm openssh git curl sed awk pacman-contrib

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Provision Non-Root Environment & Run
        shell: bash
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # 1. Initialize keyring and install essentials (openssh is required for AUR)
          pacman-key --init && pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed sudo binutils fakeroot openssh
          
          # 2. Match GitHub Runner UID (1001) to prevent repository permission bugs
          useradd -m -u 1001 -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # 3. Securely deploy the SSH Private Key to the builder's home folder
          mkdir -p /home/builder/.ssh
          echo "$AUR_SSH_KEY" > /home/builder/.ssh/id_ed25519
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/id_ed25519
                    
          # 4. Pre-approve AUR (aur.archlinux.org) SSH host key fingerprint
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          
          # 5. Fix permissions so the 'builder' user owns its home and workspace
          chown -R builder:builder /home/builder/.ssh
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Process Version and Run Script
        shell: bash
        run: | 
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          
          VERSION="${TAG_NAME#v}"
          echo "Version: $VERSION"
          chmod +x ./scripts/make_pkgbuild.sh
          su builder -c "./scripts/make_pkgbuild.sh \"$VERSION\""

      - name: Publish Automatically directly to the AUR Server
        shell: bash
        run: |
          export TAG_NAME="${{ github.event.release.tag_name || inputs.tag_name }}"

          # Use -w to forward our TAG_NAME environment variable safely
          su -w TAG_NAME builder -c '
            mkdir -p aur-repo
            cd aur-repo
            
            # Clone using the builder identity (which has the SSH key ready)
            git clone ssh://aur@aur.archlinux.org/qredshift.git .
            
            # Copy your newly generated package files into place
            cp ../aur/PKGBUILD .
            cp ../aur/.SRCINFO .
            
            # Configure Git inside the builder workspace context
            git config user.name "Raphael Quintao"
            git config user.email "raphaelquintao@gmail.com"
            
            git add PKGBUILD .SRCINFO
            
            # Commit and push
            git commit -m "Update to version $TAG_NAME" || echo "No changes to publish"
            git push origin master
          '