name: Update AUR Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to fetch assets and update (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-aur-manifest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Missing Automation Utilities inside Arch
        shell: bash
        run: |
          pacman -Syu --noconfirm openssh git curl sed awk pacman-contrib

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Fix: Fetch everything so git knows how to merge HEAD properly
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.release.target_commitish }}

      - name: Trust Git Directory Ownership
        shell: bash
        run: |
          git config --global --add safe.directory /__w/qredshift/qredshift

      - name: Download Built Tarballs from Release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi

          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          cd dist
          
          for SUFFIX in x86_64 i686 aarch64 armv7l powerpc64le riscv64; do
            FILE_NAME="qredshift_${VERSION}_${SUFFIX}.tar.gz"
            URL="https://github.com{{ github.repository }}/releases/download/${TAG_NAME}/${FILE_NAME}"
            echo "Fetching asset from: $URL"
            curl -L -O -s --fail "$URL" || echo "Warning: Could not fetch $FILE_NAME"
          done

      - name: Update PKGBUILD Version and SHA256 Hashes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          
          VERSION="${TAG_NAME#v}"
          TARGET_PKGBUILD="scripts/aur/PKGBUILD"
          
          sed -i "s/pkgver=.*/pkgver=$VERSION/" "$TARGET_PKGBUILD"
          sed -i "s/_pkgver=.*/_pkgver=$VERSION/" "$TARGET_PKGBUILD"
          
          for pair in x86_64:x86_64 i686:i686 aarch64:aarch64 armv7h:armv7l ppc64le:powerpc64le riscv64:riscv64; do
            ARCH="${pair%%:*}"
            SUFFIX="${pair#*:}"
            
            FILE_PATH=$(find dist/ -type f -name "qredshift_${VERSION}_${SUFFIX}.tar.gz" | head -n 1)
            
            if [ -f "$FILE_PATH" ]; then
              COMPUTED_HASH=$(sha256sum "$FILE_PATH" | awk '{print $1}')
              echo "Calculated $ARCH hash: $COMPUTED_HASH"
              sed -i "s/sha256sums_${ARCH}=('SKIP')/sha256sums_${ARCH}=('${COMPUTED_HASH}')/" "$TARGET_PKGBUILD"
            else
              echo "Warning: No build file found for $ARCH ($SUFFIX)"
            fi
          done

      - name: Generate Fresh .SRCINFO for Arch Linux
        shell: bash
        run: |
          # 1. Un-expire the 'nobody' user account inside the Arch container
          chage -E -1 nobody

          # 2. Give 'nobody' user a fake home directory for config caches
          mkdir -p /tmp/nobody-home
          chown -R nobody:nobody /tmp/nobody-home
          
          # 3. Grant temporary folder access to 'nobody'
          chown -R nobody:nobody scripts/aur
          
          # 4. Execute printsrcinfo as the unprivileged user
          cd scripts/aur
          HOME=/tmp/nobody-home su nobody -s /bin/bash -c "makepkg --printsrcinfo" > .SRCINFO
          
          # 5. Reset ownership back to root for the subsequent Git steps
          cd ../..
          chown -R root:root scripts/aur


      - name: Commit and Push Changes Back to GitHub
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
            TARGET_BRANCH="${{ github.event.release.target_commitish }}"
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add scripts/aur/PKGBUILD scripts/aur/.SRCINFO
          git commit -m "chore(aur): auto-update PKGBUILD & .SRCINFO for release ${TAG_NAME}" || echo "No changes to commit"
          
          # Fix: Pushes securely back to the tracking upstream branch branch tip
          git push origin HEAD:refs/heads/${TARGET_BRANCH}

      - name: Publish Automatically directly to the AUR Server
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_aur -o UserKnownHostsFile=~/.ssh/known_hosts"
          
          mkdir -p /tmp/aur-repo
          cd /tmp/aur-repo
          
          git clone ssh://aur@aur.archlinux.org/qredshift.git .
          
          cp /__w/qredshift/qredshift/scripts/aur/PKGBUILD .
          cp /__w/qredshift/qredshift/scripts/aur/.SRCINFO .
          
          git config user.name "Raphael Quintao"
          git config user.email "raphaelquintao@gmail.com"
          
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${{ github.event.release.tag_name || inputs.tag_name }}" || echo "No changes to publish"
          git push origin master
